name: Sync IDL to PAM Platform

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  notify-pam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate IDL metadata, includes and routes
        run: node scripts/validate.js

      - name: Create PAM Git pipeline
        env:
          PAM_PLATFORM_URL: ${{ secrets.PAM_PLATFORM_URL }}
          PAM_SYNC_TOKEN: ${{ secrets.PAM_SYNC_TOKEN }}
          PAM_IDL_REPOSITORY_NAME: ${{ vars.PAM_IDL_REPOSITORY_NAME || 'pam-idl' }}
        run: |
          if [ -z "$PAM_PLATFORM_URL" ] || [ -z "$PAM_SYNC_TOKEN" ]; then
            echo "PAM_PLATFORM_URL or PAM_SYNC_TOKEN secret is not set"
            exit 1
          fi

          echo "Creating PAM pipeline for ${GITHUB_REF}@${GITHUB_SHA}..."
          jq -nc \
            --arg eventId "${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --arg repository "$PAM_IDL_REPOSITORY_NAME" \
            --arg ref "$GITHUB_REF" \
            --arg refName "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson sequence "$GITHUB_RUN_ID" \
            '{eventId:$eventId,repository:$repository,ref:$ref,refName:$refName,commit:$commit,event:$event,generatedAt:$generatedAt,sequence:$sequence}' \
            > /tmp/pam-pipeline-request.json
          HTTP_CODE=$(curl -sS -o /tmp/pam-sync-resp.json -w "%{http_code}" \
            -X POST "$PAM_PLATFORM_URL/api/idl/pipelines" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $PAM_SYNC_TOKEN" \
            --data-binary @/tmp/pam-pipeline-request.json)

          echo "Trigger response ($HTTP_CODE):"
          cat /tmp/pam-sync-resp.json
          echo ""

          if [ "$HTTP_CODE" != "202" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "PAM pipeline creation failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "PAM sync request accepted."
